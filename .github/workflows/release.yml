name: Release

on:
  repository_dispatch:
    types: [basedeck-release]
  workflow_dispatch:
    inputs:
      ref:
        description: Private source ref or commit SHA
        required: true
      tag:
        description: Release tag (v0.34.0)
        required: true
      source_repository:
        description: Private source repository
        required: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      tag: ${{ steps.release.outputs.tag }}
      source_repository: ${{ steps.release.outputs.source_repository }}
    steps:
      - id: release
        env:
          SOURCE_REF: ${{ github.event.client_payload.ref || inputs.ref }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository || vars.BASEDECK_SOURCE_REPOSITORY || 'zoubingwu/basedeck' }}
          GH_TOKEN: ${{ secrets.BASEDECK_SOURCE_REPO_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          ENCODED_REF="$(jq -rn --arg ref "$SOURCE_REF" '$ref | @uri')"
          SOURCE_SHA="$(gh api "/repos/$SOURCE_REPOSITORY/commits/$ENCODED_REF" --jq .sha)"
          echo "ref=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_repository=$SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, target: darwin/arm64, artifact: macos-arm64}
          - {os: macos-latest, target: darwin/amd64, artifact: macos-x64}
          - {os: windows-latest, target: windows/amd64, artifact: windows-x64}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.metadata.outputs.source_repository }}
          token: ${{ secrets.BASEDECK_SOURCE_REPO_TOKEN }}
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run ./cmd/smoke
      - run: go run ./cmd/smoke-cloud
      - run: go run ./cmd/smoke-credentials
        env:
          BASEDECK_VERIFY_SYSTEM_KEYCHAIN: '1'
      - name: Build signed native and legacy-compatible updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: go run ./cmd/package-release -platform ${{ matrix.target }}
      - run: go run ./cmd/verify-release -platform ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  draft:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - name: Regenerate combined checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_REF: ${{ needs.metadata.outputs.ref }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]] || exit 1
          else
            printf 'Native database browser with table structure, data previews and read-only MCP. Built-in AI chat and SQL workbench have been removed.\n\nExisting installations can update through their normal updater. Connections, encrypted credentials and license activations are preserved; a configuration backup is created before the first write. See the repository README for migration and rollback details.\n\nSource commit: %s\n' "$SOURCE_REF" > release-notes.md
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --title "BaseDeck $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
